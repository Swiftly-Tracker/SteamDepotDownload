name: Build

on: [push, workflow_dispatch, pull_request]

permissions:
  contents: write

jobs:
  versioning:
    runs-on: ubuntu-latest
    outputs:
      fullSemVer: ${{ steps.version_step.outputs.fullSemVer }}
      semVer: ${{ steps.version_step.outputs.semVer }}
      informationalVersion: ${{ steps.version_step.outputs.informationalVersion }}
      preReleaseLabel: ${{ steps.version_step.outputs.preReleaseLabel }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Fetch all tags
      run: |
        git fetch --tags --force
        git tag
    - name: Setup GitVersion
      uses: gittools/actions/gitversion/setup@v3.2.1
      with:
        versionSpec: '5.12.x'
    - name: Determine Version
      id: version_step
      uses: gittools/actions/gitversion/execute@v3.2.1

  build:
    needs: versioning
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish self-contained
      run: >
        dotnet publish SteamDepotDownload.App/SteamDepotDownload.App.csproj
        -c Release
        -r ${{ matrix.rid }}
        --self-contained true
        -p:PublishSingleFile=true
        -p:PublishReadyToRun=true
        -p:PublishTrimmed=false
        -p:Version=${{ needs.versioning.outputs.semVer }}
        -p:FileVersion=${{ needs.versioning.outputs.semVer }}
        -p:InformationalVersion=${{ needs.versioning.outputs.informationalVersion }}
        -o out/${{ matrix.rid }}

    - name: Publish framework-dependent
      run: >
        dotnet publish SteamDepotDownload.App/SteamDepotDownload.App.csproj
        -c Release
        -r ${{ matrix.rid }}
        --self-contained false
        -p:PublishSingleFile=false
        -p:PublishReadyToRun=false
        -p:Version=${{ needs.versioning.outputs.semVer }}
        -p:FileVersion=${{ needs.versioning.outputs.semVer }}
        -p:InformationalVersion=${{ needs.versioning.outputs.informationalVersion }}
        -o out/${{ matrix.rid }}-portable

    - name: Upload self-contained build
      uses: actions/upload-artifact@v4
      with:
        name: sdd-${{ matrix.rid }}
        path: out/${{ matrix.rid }}

    - name: Upload framework-dependent build
      uses: actions/upload-artifact@v4
      with:
        name: sdd-${{ matrix.rid }}-portable
        path: out/${{ matrix.rid }}-portable

  packaging:
    needs: [versioning, build]
    runs-on: ubuntu-latest
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: sdd-*
        path: artifacts

    - name: Create packages
      run: |
        chmod +x artifacts/sdd-linux-x64/SteamDepotDownload.App || true
        chmod +x artifacts/sdd-linux-x64-portable/SteamDepotDownload.App || true

        mkdir -p release
        for name in win-x64 linux-x64 win-x64-portable linux-x64-portable; do
          (cd "artifacts/sdd-$name" && zip -r "$GITHUB_WORKSPACE/release/SteamDepotDownload-$name.zip" .)
        done
        ls -la release

    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: SteamDepotDownload-packages
        path: release/*.zip

  releasing:
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') }}
    needs: [versioning, packaging]
    runs-on: ubuntu-latest
    env:
      TAG_NAME: v${{ needs.versioning.outputs.semVer }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Create tag
      run: |
        TAG_NAME="${{ env.TAG_NAME }}"
        MSG="Release v${{ needs.versioning.outputs.semVer }}"

        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
          exit 0
        fi
        git tag -a "$TAG_NAME" -m "${MSG}"
        git push origin "$TAG_NAME"

    - name: Download packages
      uses: actions/download-artifact@v4
      with:
        name: SteamDepotDownload-packages
        path: ./release

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          release/SteamDepotDownload-win-x64.zip
          release/SteamDepotDownload-linux-x64.zip
          release/SteamDepotDownload-win-x64-portable.zip
          release/SteamDepotDownload-linux-x64-portable.zip
        prerelease: ${{ needs.versioning.outputs.preReleaseLabel != '' }}
        tag_name: ${{ env.TAG_NAME }}
        name: Release v${{ needs.versioning.outputs.semVer }}
        body: ${{ needs.versioning.outputs.semVer }}

  nuget:
    if: ${{ github.event_name == 'push' && github.repository_owner == 'Swiftly-Tracker' }}
    needs: [versioning, releasing]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Pack
      run: |
        dotnet pack SteamDepotDownload.csproj --include-symbols -c Release \
          -p:Version=${{ needs.versioning.outputs.semVer }} \
          -p:InformationalVersion=${{ needs.versioning.outputs.informationalVersion }} \
          -o nupkgs

    - name: NuGet login (OIDC -> temporary API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: NuGet push
      run: |
        dotnet nuget push "nupkgs/SteamDepotDownload.${{ needs.versioning.outputs.semVer }}.nupkg" \
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
