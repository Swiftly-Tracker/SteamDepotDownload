name: Synchronize main to beta

on:
  workflow_dispatch:

  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

jobs:
  on-pr-merged:
    if: (github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'beta') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Synchronize
      run: |
        git fetch origin
        git checkout beta
        git reset --hard origin/main
        git push -f origin beta
