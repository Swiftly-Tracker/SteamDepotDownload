name: Bug Report
description: Report a bug or issue with SteamDepotDownload
title: "[BUG] "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible.

        **Never paste account credentials, refresh tokens, or the contents of `account.config` into an issue.**

  - type: input
    id: version
    attributes:
      label: SteamDepotDownload Version
      description: Output of `SteamDepotDownload.App -version`, or the commit hash you built.
      placeholder: e.g., v1.0.0, or 13d759c
    validations:
      required: true

  - type: dropdown
    id: usage
    attributes:
      label: Usage
      description: How are you using SteamDepotDownload?
      options:
        - CLI tool (one-shot)
        - CLI tool (interactive terminal)
        - Library (NuGet package)
    validations:
      required: true

  - type: dropdown
    id: flavor
    attributes:
      label: Build Flavor
      description: Which build are you running?
      options:
        - Self-contained release archive
        - Portable release archive (framework-dependent)
        - Built from source
        - NuGet package
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What operating system are you using?
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command Line / API Call
      description: The exact command or API call used, including app and depot IDs. Redact usernames.
      render: text
      placeholder: |
        ./SteamDepotDownload.App -app 1007 -depot 1004 -dir ./redist
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Run '...'
        2. Wait for the depot to resolve
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: A clear and concise description of what actually happened.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs/Console Output
      description: If applicable, add console output or log files. Re-run with `-debug` for verbose logging.
      render: text
      placeholder: Paste your logs here...

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here — file filters used, disk layout, network setup.
